name = "dialedin-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Served at https://sync.imdialedin.app (the domain's DNS is on Cloudflare).
routes = [{ pattern = "sync.imdialedin.app", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "dialedin-sync"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

[vars]
ALLOWED_ORIGINS = "https://imdialedin.app,http://localhost:5173,http://localhost:4173"
