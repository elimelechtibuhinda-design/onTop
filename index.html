<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#002145">
  <meta name="description" content="Dialed In — a study tracker for students. Plan with SMART goals, focus with a timer, take real breaks. No sign-in; your study data stays on your device.">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Dialed In</title>
</head>
<body>
  <div id="app" aria-live="polite"><p id="boot-msg" style="font:600 16px system-ui,sans-serif;color:#52637a;text-align:center;margin-top:40vh">Loading Dialed In…</p></div>
  <script>
    // Right after a deploy, a cached copy of this page can point at code files that were just replaced.
    // If one fails to load, reload with a cache-busting query (up to twice) instead of showing a white page.
    addEventListener("error", function (e) {
      var t = e.target;
      if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
      var n = 0;
      try { n = +sessionStorage.getItem("dialedin-retry") || 0; sessionStorage.setItem("dialedin-retry", n + 1); } catch (_) { n = 9; }
      if (n < 2) {
        setTimeout(function () { var u = new URL(location.href); u.searchParams.set("r", Date.now()); location.replace(u); }, 1200 * (n + 1));
      } else {
        var m = document.getElementById("boot-msg");
        if (m) m.innerHTML = 'Dialed In just got updated and is still arriving.<br><a href="./" style="color:#0055B7">Tap to refresh</a>';
      }
    }, true);
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
